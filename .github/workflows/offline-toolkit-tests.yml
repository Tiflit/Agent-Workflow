name: Offline Toolkit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  offline-tests:
    name: Run offline toolkit unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Run offline regression fixtures
        run: python -m unittest discover -s tests/offline -p 'test_*.py' -v

      - name: Run clean project bootstrap fixtures
        run: python -m unittest discover -s tests/bootstrap -p 'test_*.py' -v
